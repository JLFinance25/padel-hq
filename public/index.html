<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <title>CasaPala</title>
  <meta name="description" content="Our Virtual Enterprise firm's shared to-do list, calendar and office to-do lists.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F0B429'/%3E%3Cpath d='M5 11c6 3 16 3 22 0M5 21c6-3 16-3 22 0' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6L7 10H4zM16.5 9.5a3.5 3.5 0 0 1 0 5M19 7a7 7 0 0 1 0 10"/></symbol>
      <symbol id="i-board" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h10"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9.3 10v10M14.7 10v10M8 3v4M16 3v4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19l1-4L16 5l3 3L9 18l-4 1zM14 7l3 3"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5"/></symbol>
      <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4M14 8l4 4-4 4M18 12H9"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 20V4M6 5h11l-2 4 2 4H6"/></symbol>
    </defs>
  </svg>

  <!-- Lock screen: the class passcode -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="login-brand"><span class="ball" aria-hidden="true"></span><span class="wordmark">CasaPala</span></div>
      <p class="login-sub">Our firm's to-dos and deadlines. Everyone in class uses the class passcode.</p>
      <label class="field">Your first name
        <input id="login-name" type="text" required maxlength="40" autocomplete="given-name" spellcheck="false">
      </label>
      <label class="field">Passcode
        <input id="login-pass" type="password" required autocomplete="current-password" autocapitalize="off" spellcheck="false">
      </label>
      <button class="btn btn-primary btn-wide" type="submit">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <button class="skip" type="button" data-act="skip">Skip to content</button>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="CasaPala home">
        <span class="ball" aria-hidden="true"></span><span class="wordmark">CasaPala</span>
      </a>
      <div class="topbar-right">
        <button id="logout-btn" class="btn btn-ghost" title="Log out"><svg class="ic"><use href="#i-exit"/></svg>Log out</button>
      </div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
    <form id="name-bar" class="name-bar" data-form="name" hidden>
      <label for="name-bar-input">Add your first name so your check-offs show who did them.</label>
      <span class="name-bar-row"><input id="name-bar-input" type="text" maxlength="40" autocomplete="given-name" spellcheck="false"><button class="btn btn-sm btn-primary" type="submit">Save</button></span>
    </form>
    <main id="main" tabindex="-1"></main>
  </div>

  <!-- Detail / edit panel -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title"></aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js?v=11"></script>
  <script src="js/board.js?v=11"></script>
  <script src="js/views.js?v=11"></script>
  <script src="js/drawer.js?v=11"></script>
  <script src="js/main.js?v=11"></script>
</body>
</html>
